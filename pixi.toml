[workspace]
name = "mojovec"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
mojo = "==1.0.0b2"
python = ">=3.12,<3.15"
numpy = "*"
pyarrow = ">=21"
datasets = ">=3,<5"
pip = "*"
pytest = "*"
python-build = "*"
setuptools = ">=77"
wheel = "*"

[tasks]
mojo-version = "mojo --version"
build-mojo = "mkdir -p dist && mojo precompile mojovec -o dist/mojovec.mojoc"
test-mojo = "bash tests/run_all.sh"
install-python = "python -m pip install --no-build-isolation --editable ."
test-python = { cmd = "python -m pytest -q -p no:cacheprovider python/tests", depends-on = ["install-python"] }
build-python = "python -m build --wheel --no-isolation --outdir dist"
test = { depends-on = ["test-mojo", "test-python"] }
