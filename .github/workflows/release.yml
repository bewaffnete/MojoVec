name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  MOJO_VERSION: 1.0.0b2

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.0
          run-install: false

      - name: Install Mojo
        run: |
          pixi global install "mojo==$MOJO_VERSION" \
            -c https://conda.modular.com/max \
            -c conda-forge
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip setuptools wheel pytest

      - name: Build Python wheel
        working-directory: python
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            python setup.py bdist_wheel --plat-name manylinux2014_x86_64
          else
            python setup.py bdist_wheel
          fi

      - name: Run Python Tests
        run: |
          PYTHONPATH=python python -m pytest python/tests/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mojovec-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: python/dist/*.whl
          if-no-files-found: error

  build-mojo:
    name: Build and test pure Mojo package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.0
          run-install: false

      - name: Install Mojo
        run: |
          pixi global install "mojo==$MOJO_VERSION" \
            -c https://conda.modular.com/max \
            -c conda-forge
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Build precompiled package
        run: |
          mkdir -p dist
          mojo precompile mojovec -o dist/mojovec.mojoc

      - name: Test precompiled package as a downstream client
        run: |
          mkdir package-smoke
          cp dist/mojovec.mojoc tests/smoke_mojoc.mojo package-smoke/
          cd package-smoke
          mojo run smoke_mojoc.mojo

      - name: Run Mojo test suite
        run: |
          for test_file in tests/test_*.mojo; do
            echo ">>> $test_file"
            mojo build -I . "$test_file" -o /tmp/mojovec_test_bin
            /tmp/mojovec_test_bin
          done

      - name: Upload Mojo package
        uses: actions/upload-artifact@v7
        with:
          name: mojovec-mojoc
          path: dist/mojovec.mojoc
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-wheels, build-mojo]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: mojovec-*
          merge-multiple: true

      - name: Release to GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/mojovec.mojoc
          generate_release_notes: true

      - name: Prepare PyPI artifacts
        run: |
          mkdir -p pypi_dist
          cp dist/*.whl pypi_dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: pypi_dist/
