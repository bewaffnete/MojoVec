name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mojo:
    name: Mojo tests and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          run-install: true

      - name: Build precompiled package
        run: pixi run build-mojo

      - name: Test precompiled package as a downstream client
        run: |
          mkdir package-smoke
          cp dist/mojovec.mojoc tests/smoke_mojoc.mojo package-smoke/
          cd package-smoke
          pixi run mojo smoke_mojoc.mojo

      - name: Run Mojo test suite
        run: pixi run test-mojo

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          run-install: false

      - name: Install Mojo
        run: |
          pixi global install max \
            -c https://conda.modular.com/max \
            -c conda-forge
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install Python build and test dependencies
        run: python -m pip install --upgrade pip build pytest numpy pyarrow datasets

      - name: Build wheel for Python ${{ matrix.python-version }}
        run: python -m build --wheel --outdir dist

      - name: Install wheel in Python ${{ matrix.python-version }}
        shell: bash
        run: |
          wheel_path="$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)"
          python -m pip install --force-reinstall "$wheel_path"

      - name: Test installed wheel
        shell: bash
        run: |
          python -c 'import mojovec; from importlib.metadata import version; assert mojovec.__version__ == version("mojovec"); print(mojovec.__version__, mojovec._native_backend)'
          if [ "$RUNNER_OS" == "Linux" ]; then
            MOJOVEC_FORCE_BACKEND=avx2 python -c \
              'import importlib.util; import mojovec; assert mojovec._native_backend == "avx2"; assert importlib.util.find_spec("mojovec._avx2._native"); assert importlib.util.find_spec("mojovec._avx512._native"); print(mojovec._native_backend)'
            if grep -qw avx512f /proc/cpuinfo; then
              MOJOVEC_FORCE_BACKEND=avx512 python -c \
                'import mojovec; assert mojovec._native_backend == "avx512"; print(mojovec._native_backend)'
            fi
          fi

      - name: Run Python tests
        run: python -m pytest -q -p no:cacheprovider python/tests
