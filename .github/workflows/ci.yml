name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MOJO_VERSION: 1.0.0b2

jobs:
  mojo:
    name: Mojo tests and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.0
          run-install: false

      - name: Install Mojo
        run: |
          pixi global install "mojo==$MOJO_VERSION" \
            -c https://conda.modular.com/max \
            -c conda-forge
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Build precompiled package
        run: |
          mkdir -p dist
          mojo precompile mojovec -o dist/mojovec.mojoc

      - name: Test precompiled package as a downstream client
        run: |
          mkdir package-smoke
          cp dist/mojovec.mojoc tests/smoke_mojoc.mojo package-smoke/
          cd package-smoke
          mojo run smoke_mojoc.mojo

      - name: Run Mojo test suite
        run: |
          for test_file in tests/test_*.mojo; do
            echo ">>> $test_file"
            mojo build -I . "$test_file" -o /tmp/mojovec_test_bin
            /tmp/mojovec_test_bin
          done

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.0
          run-install: false

      - name: Install Mojo
        run: |
          pixi global install "mojo==$MOJO_VERSION" \
            -c https://conda.modular.com/max \
            -c conda-forge
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip setuptools wheel pytest

      - name: Build Python extension
        working-directory: python
        run: python setup.py build_ext --inplace

      - name: Run Python tests
        run: PYTHONPATH=python python -m pytest python/tests/
